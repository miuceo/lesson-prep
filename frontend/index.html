<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="Vazifa — oddiy va sokin vazifalar menejeri">
  <title>Vazifa</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Literata:opsz,wght@7..72,400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Icons (Lucide, inlined: no icon font to download, no flash of icon names) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
      <symbol id="i-tasks" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-board" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></symbol>
      <symbol id="i-calendar-x" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m14 14-4 4"/><path d="m10 14 4 4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
      <symbol id="i-list-checks" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Asosiy menyu">
      <div class="sidebar__top">
        <a class="brand" href="#/" aria-label="Vazifa — bosh sahifa">
          <span class="brand__mark"><svg class="i"><use href="#i-check"/></svg></span>
          <span class="brand__name">Vazifa</span>
        </a>
        <nav class="nav">
          <a class="nav__item" href="#/" data-route="dashboard"><svg class="i"><use href="#i-dashboard"/></svg><span>Bosh sahifa</span></a>
          <a class="nav__item" href="#/vazifalar" data-route="tasks"><svg class="i"><use href="#i-tasks"/></svg><span>Vazifalar</span></a>
          <a class="nav__item" href="#/loyihalar" data-route="projects"><svg class="i"><use href="#i-folder"/></svg><span>Loyihalar</span></a>
        </nav>
        <div class="side-projects">
          <p class="side-projects__label">Loyihalar</p>
          <div id="sideProjects"></div>
        </div>
      </div>
      <button class="side-add" type="button" data-action="new-project">
        <svg class="i"><use href="#i-plus"/></svg><span>Loyiha qo'shish</span>
      </button>
    </aside>
    <div class="scrim" data-action="close-sidebar"></div>

    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn only-mobile" type="button" data-action="open-sidebar" aria-label="Menyuni ochish">
          <svg class="i"><use href="#i-menu"/></svg>
        </button>
        <a class="brand brand--mobile only-mobile" href="#/" aria-label="Vazifa — bosh sahifa">
          <span class="brand__mark"><svg class="i"><use href="#i-check"/></svg></span>
          <span class="brand__name">Vazifa</span>
        </a>
        <label class="search">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Vazifalarni qidirish..." aria-label="Vazifalarni qidirish" autocomplete="off">
        </label>
        <div class="topbar__right">
          <button class="icon-btn only-mobile" type="button" data-action="toggle-search" aria-label="Qidirish">
            <svg class="i"><use href="#i-search"/></svg>
          </button>
          <button class="btn btn--primary hide-mobile" type="button" data-action="new-task">
            <svg class="i"><use href="#i-plus"/></svg><span>Yangi vazifa</span>
          </button>
          <span class="avatar" aria-hidden="true"><svg class="i"><use href="#i-user"/></svg></span>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1">
        <div class="skeleton-page" aria-hidden="true"></div>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Asosiy menyu">
      <a href="#/" data-route="dashboard"><svg class="i"><use href="#i-dashboard"/></svg><span>Bosh sahifa</span></a>
      <a href="#/vazifalar" data-route="tasks"><svg class="i"><use href="#i-tasks"/></svg><span>Vazifalar</span></a>
      <a href="#/loyihalar" data-route="projects"><svg class="i"><use href="#i-folder"/></svg><span>Loyihalar</span></a>
    </nav>
    <button class="fab" id="fab" type="button" data-action="fab" aria-label="Yangi vazifa">
      <svg class="i"><use href="#i-plus"/></svg>
    </button>
  </div>

  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
